<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#f7f9fb; --border:#e1e6ed; --border-strong:#cfd6df;
  --text:#0e2338; --muted:#5b6b7e;
  --accent:#1739f8; --accent-soft:#e8ecfe; --on-accent:#fff;
  --danger:#c62828; --danger-soft:#fdecec;
  --ok:#1b7f4a; --ok-soft:#e4f4eb; --warn:#9a5700; --warn-soft:#fdf0dd; --info:#5b3cc4; --info-soft:#efeafd;
  --neutral:#475467; --neutral-soft:#eef1f5;
  --wave:#c5d0de; --wave-played:#1739f8; --mark:#d97706;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:10px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161d26; --panel-2:#1b242f; --border:#26313e; --border-strong:#344150;
  --text:#e5eaf0; --muted:#95a1b0;
  --accent:#6b86ff; --accent-soft:#1b2452; --on-accent:#08111f;
  --danger:#ff6b6b; --danger-soft:#3a1f23; --ok:#4cc38a; --ok-soft:#15302a; --warn:#f0a940; --warn-soft:#382a15; --info:#a996ff; --info-soft:#2a2447;
  --neutral:#a8b3c1; --neutral-soft:#222c38;
  --wave:#334050; --wave-played:#6b86ff; --mark:#f0a940;
  --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}
kbd,.kbd{font:11px/1 ui-monospace,Consolas,monospace;padding:3px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn:focus-visible,.item:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.danger:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.text-danger{color:var(--danger)}
.btn kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}

/* Top bar */
.topbar{display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.brand-logo{height:40px;width:auto;display:block}
.logo-dark{display:none}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
.brand small{font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.3;padding-left:12px;border-left:1px solid var(--border)}
.stats{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;padding:4px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);min-width:108px;cursor:default;text-align:left}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--border-strong)}
.stat.warn b{color:var(--warn)}
.top-actions{display:flex;gap:6px;align-items:center}

/* Layout */
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
.col-list{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.col-main{overflow:auto;min-height:0;padding:18px 22px 40px}

/* Filters */
.filters{padding:12px;border-bottom:1px solid var(--border);display:grid;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:36px;padding:0 10px 0 34px;border:1px solid var(--border-strong);border-radius:8px;background:var(--panel-2)}
.filter-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filter-row select{height:32px;border:1px solid var(--border);border-radius:7px;background:var(--panel);padding:0 6px;font-size:12.5px;min-width:0}
.list-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 2px}
.list{flex:1;overflow:auto;padding:4px 8px 12px}
.day{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 6px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 10px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--panel-2)}
.item.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item-top{display:flex;align-items:center;gap:8px}
.item-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.item-title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.item-meta svg{vertical-align:-2px}
.list-foot{border-top:1px solid var(--border);padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.empty-list{padding:40px 16px;text-align:center;color:var(--muted)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.neutral{background:var(--neutral-soft);color:var(--neutral)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}

/* Cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:12px}
.card-title .spacer{flex:1}
.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.grid-2 > .card{margin-bottom:0}

/* Form */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.form-grid .span2{grid-column:span 2}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.block{margin-top:12px}
input[type=text],input:not([type]),select,textarea{font-weight:400;font-size:14px;color:var(--text)}
.form-grid input,.form-grid select,label.block textarea,.mark-row input,.settings input[type=text]{height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--panel);padding:0 10px}
label.block textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.field-label{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
label.check{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:13.5px;color:var(--text);padding:5px 8px;border-radius:6px;cursor:pointer}
label.check:hover{background:var(--panel-2)}
label.check input{width:16px;height:16px;accent-color:var(--accent)}
.history{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--info-soft);color:var(--info);font-size:12.5px}
.history a{color:inherit;font-weight:600}

/* Live call */
.live-head{position:sticky;top:-18px;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin:-4px 0 14px;border-radius:var(--radius);background:var(--panel);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border));box-shadow:var(--shadow)}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1.4s infinite}
.paused .rec-dot{animation:none;background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live-title{font-weight:700}
.live-timer{font:600 26px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;min-width:96px}
.meter{width:110px;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden}
.meter div{height:100%;width:0;background:var(--ok);transition:width .08s}
.live-head .spacer{flex:1}
.mark-row{display:flex;gap:8px}
.mark-row input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--border-strong);background:var(--panel-2);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.marks{list-style:none;margin:10px 0 0;padding:0}
.marks li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px}
.marks li:hover{background:var(--panel-2)}
.marks .t{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--mark);min-width:44px}
.marks .l{flex:1}
.marks .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.marks .x:hover{color:var(--danger);background:var(--danger-soft)}
.marks.clickable li{cursor:pointer}
.marks-empty{color:var(--muted);font-size:13px;padding:6px 8px}
.live-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:14px;border-radius:var(--radius);background:var(--danger-soft);color:var(--danger);font-weight:600;cursor:pointer;border:0;width:100%;text-align:left}
.live-banner .live-timer{font-size:16px;min-width:0}

/* Detail */
.detail-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}
.detail-head h2{margin:2px 0 4px;font-size:21px}
.detail-head .reg{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.detail-head .grow{flex:1;min-width:240px}
.head-actions{display:flex;gap:6px;align-items:center}
.status-select{height:34px;border-radius:8px;border:1px solid var(--border-strong);background:var(--panel);padding:0 8px;font-weight:600}

/* Player */
.wave-wrap{position:relative;height:96px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);cursor:pointer;overflow:hidden}
.wave-wrap canvas{width:100%;height:100%;display:block}
.wave-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
.wave-hover{position:absolute;top:4px;padding:2px 6px;border-radius:4px;background:var(--text);color:var(--panel);font:11px ui-monospace,Consolas,monospace;pointer-events:none;transform:translateX(-50%);display:none}
.controls{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.play:hover{filter:brightness(1.08)}
.ptime{font:13px ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;margin-left:6px}
.controls .spacer{flex:1}
.rate{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.rate button{border:0;background:var(--panel);padding:6px 9px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--border)}
.rate button:last-child{border-right:0}
.rate button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.no-audio{padding:18px;text-align:center;color:var(--muted);background:var(--panel-2);border-radius:8px;border:1px dashed var(--border-strong)}
pre.report{margin:0;white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:520px;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin-top:10px}

/* Empty state */
.empty{max-width:640px;margin:8vh auto 0;text-align:center}
.empty .big{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty h2{margin:0 0 6px}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;max-width:380px;margin:22px auto 0;font-size:13px;align-items:center}
.shortcuts kbd{justify-self:end}

/* Dialog + toast */
dialog{border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(520px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.settings{padding:20px;display:grid;gap:14px}
.settings h3{margin:0}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:400;color:var(--text);flex-direction:row}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio b{display:block}
.radio span{color:var(--muted);font-size:12.5px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:50}
.toast{padding:10px 16px;border-radius:9px;background:var(--text);color:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;animation:tin .2s}
.toast.warn{background:var(--warn);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
[hidden]{display:none!important}

/* Modos (Atendimentos / CRM) */
.modes{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border)}
.modes button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.modes button:hover{color:var(--text)}
.modes button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}

/* CRM de reuniões (calls analisadas pela extensão CallTrack Copilot) */
.crm{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.crm-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
.crm-toolbar .search{flex:1;min-width:220px;max-width:420px}
.crm-toolbar select{height:36px;border:1px solid var(--border-strong);border-radius:8px;background:var(--panel);padding:0 8px;font-size:13px}
.crm-toolbar .spacer{flex:1}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;padding:16px 18px;overflow:auto}
.kcol{display:flex;flex-direction:column;min-height:0;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius)}
.kcol h3{display:flex;align-items:center;gap:8px;margin:0;padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--border)}
.kcol h3 .dot{width:9px;height:9px;border-radius:50%}
.kcol h3 .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcards{flex:1;overflow:auto;padding:10px;display:grid;align-content:start;gap:8px;min-height:80px}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.kcard:hover{border-color:var(--border-strong)}
.kcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.kcard.dragging{opacity:.45}
.kcard-top{display:flex;align-items:center;gap:8px}
.kcard-title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.stages{display:flex;gap:4px;margin-top:8px}
.stg{font:600 10.5px/1 ui-monospace,Consolas,monospace;padding:3px 6px;border-radius:5px;background:var(--neutral-soft);color:var(--muted)}
.stg.partial{background:var(--warn-soft);color:var(--warn)}
.stg.complete{background:var(--ok-soft);color:var(--ok)}
.kempty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 6px}
.crm-login{max-width:440px;margin:10vh auto 0;padding:0 16px;width:100%}
.crm-login .card{display:grid;gap:12px;padding:22px}
.crm-login h2{margin:0}
.crm-login input{height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--panel);padding:0 10px}
.crm-err{color:var(--danger);font-size:13px;min-height:18px}

/* Badge "Ao vivo" piscando na cor da saúde da call */
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;
  --c:var(--neutral);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);animation:liveblink 1.4s ease-in-out infinite}
.live-badge i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent);animation:livering 1.4s ease-out infinite}
.live-badge.ok{--c:var(--ok)} .live-badge.warn{--c:var(--warn)} .live-badge.danger{--c:var(--danger)} .live-badge.neutral{--c:var(--neutral)}
.live-badge.danger{animation-duration:.8s} .live-badge.danger i{animation-duration:.8s}
@keyframes liveblink{50%{background:color-mix(in srgb,var(--c) 30%,transparent)}}
@keyframes livering{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live-badge,.live-badge i{animation:none}}
.kcard-live{margin-bottom:6px}
.stat.live b{color:var(--danger)}
.avs{display:flex;align-items:center;gap:0;margin-top:8px}
.avs .av{margin-right:-6px;border:2px solid var(--panel)}
.avs .muted{margin-left:12px}
.av{--av:28px;width:var(--av);height:var(--av);border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;
  background:var(--neutral-soft);color:var(--neutral);font-size:calc(var(--av) * .38);font-weight:700}
.av{position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--panel)}
.av.lead{background:var(--info-soft);color:var(--info)} .av.seller{background:var(--accent-soft);color:var(--accent)}

/* Detalhe da call (CRM) */
.cd-kicker{display:flex;gap:6px;align-items:center;min-height:4px;margin-bottom:4px}
.cd-right{text-align:right}
.auto{font:600 10px/1 ui-monospace,Consolas,monospace;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.health{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;--c:var(--neutral);
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.health.ok{--c:var(--ok)} .health.warn{--c:var(--warn)} .health.danger{--c:var(--danger)}
.health i{width:10px;height:10px;border-radius:50%;background:var(--c);animation:livering 1.4s ease-out infinite;box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}
.health b{color:var(--c)}
.people{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.person{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);min-width:220px}
.person.left{opacity:.6}
.spiced{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stage{border:1px solid var(--border);border-radius:9px;padding:10px;background:var(--panel-2);display:grid;gap:8px;align-content:start;min-width:0}
.stage.complete{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.stage.partial{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.stage header{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stage header b{flex:1;font-size:13px}
.stage .why{margin:0;font-size:12.5px;color:var(--muted)}
.stage .ctx{font-size:13px;background:var(--panel);border-radius:7px;padding:7px 8px}
.stage .ctx span,.stage .qlist > span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.qlist{display:grid;gap:4px}
.qlist q{display:block;quotes:none;font-size:12.5px;padding:5px 7px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0}
.qlist.lead q{border-left-color:var(--info)}
.qlist q em{font:normal 11px ui-monospace,Consolas,monospace;color:var(--muted);margin-right:6px}
dialog.wide{width:min(1280px,96vw);max-height:92vh}
.cd-edit .lbl{display:flex;align-items:center;gap:6px;min-height:16px}
.cd{padding:20px 22px;overflow:auto;max-height:92vh}
.cd-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.cd-head h2{margin:0 0 4px;font-size:20px}
.cd-head .grow{flex:1;min-width:240px}
.score{font:700 28px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.score.ok{color:var(--ok)} .score.warn{color:var(--warn)} .score.danger{color:var(--danger)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kpis .stat{cursor:default}
dl.sum{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;margin:0}
dl.sum dt{font-size:12px;font-weight:600;color:var(--muted);padding-top:1px}
dl.sum dd{margin:0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rows li{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:7px;background:var(--panel-2)}
.rows li .grow{flex:1}
.rows .t{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--mark);min-width:44px}
.turns{max-height:420px;overflow:auto;display:grid;align-content:start;gap:4px}
.turn{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:13.5px;padding:4px 6px;border-radius:6px}
.turn .t{font:12px ui-monospace,Consolas,monospace;color:var(--muted);padding-top:2px}
.turn b{font-weight:600;margin-right:6px}
.turn.lead b{color:var(--info)} .turn.seller b{color:var(--accent)}
.cd details summary{cursor:pointer;font-weight:600}
.cd-edit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end}
.cd-edit input{height:34px;border:1px solid var(--border-strong);border-radius:7px;background:var(--panel);padding:0 10px}

@media (max-width:1100px){ .spiced{grid-template-columns:repeat(2,minmax(0,1fr))} .board{grid-template-columns:repeat(3,minmax(240px,1fr))} .grid-2{grid-template-columns:1fr} .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

<main>
  <aside class="col-list">
    <div class="filters">
      <div class="search"><span id="icoSearch"></span><input id="q" placeholder="Buscar protocolo, cliente, placa, observações…  ( / )" autocomplete="off"></div>
      <div class="filter-row">
        <select id="fPeriodo" title="Período">
          <option value="hoje">Hoje</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="todos">Tudo</option>
        </select>
        <select id="fCat" title="Categoria"><option value="">Categorias</option></select>
        <select id="fStatus" title="Status"><option value="">Status</option><option value="aberto">Em aberto</option></select>
      </div>
      <div class="list-meta"><span id="count"></span><span id="countDur"></span></div>
    </div>
    <div class="list" id="list"></div>
    <div class="list-foot" id="storage"></div>
  </aside>

  <section class="col-main" id="main">
    <button class="live-banner" id="liveBanner" hidden></button>
    <div id="livePanel" hidden></div>
    <div id="detailPanel"></div>
  </section>
</main>

<section class="crm" id="crm" hidden>
  <div class="crm-login" id="crmLogin" hidden>
    <form class="card" id="crmLoginForm" onsubmit="return false">
      <h2>CRM de reuniões</h2>
      <div class="muted small">Calls do Google Meet analisadas pela extensão CallTrack Copilot (metodologia SPICED). Entre com o mesmo token usado na extensão.</div>
      <label>Servidor<input type="text" name="base" placeholder="http://localhost:8787" autocomplete="off"></label>
      <label>Token do vendedor<input type="password" name="token" placeholder="spc_…" autocomplete="off"></label>
      <div class="crm-err" id="crmErr"></div>
      <button class="btn primary" id="crmLoginBtn">Acessar CRM</button>
    </form>
  </div>
  <div id="crmApp" hidden style="display:contents">
    <div class="crm-toolbar">
      <div class="search"><span id="icoSearchCrm"></span><input id="crmQ" placeholder="Buscar lead, empresa, vendedor, resumo…" autocomplete="off"></div>
      <select id="crmSeller" title="Vendedor"><option value="">Todos os vendedores</option></select>
      <select id="crmPeriodo" title="Período">
        <option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option><option value="todos">Tudo</option>
      </select>
      <span class="spacer"></span>
      <span class="muted small" id="crmMeta"></span>
      <button class="btn" id="crmRefresh" title="Atualizar">Atualizar</button>
      <button class="btn ghost" id="crmLogout" title="Trocar token">Sair</button>
    </div>
    <div class="board" id="board"></div>
  </div>
</section>

<dialog id="dlgCrmCall" class="wide"><div class="cd" id="crmCallBody"></div></dialog>

<dialog id="dlgSettings">
  <form class="settings" method="dialog" id="settingsForm">
    <h3>Configurações</h3>
    <label>Seu nome (aparece no relatório)<input type="text" name="atendente" autocomplete="off"></label>
    <div>
      <div class="field-label" style="margin-top:0">Fonte de áudio da gravação</div>
      <div style="display:grid;gap:8px">
        <label class="radio"><input type="radio" name="audioMode" value="mic"><div><b>Somente microfone</b><span>Grava o que o microfone capta. Use se a voz do cliente sai pela caixa de som ou se a ligação é em outro aparelho.</span></div></label>
        <label class="radio"><input type="radio" name="audioMode" value="mix"><div><b>Microfone + áudio do computador</b><span>Para ligações pelo softphone no PC (fone de ouvido). A cada chamada o navegador pede para escolher a tela: marque <b>"Compartilhar áudio do sistema"</b>.</span></div></label>
      </div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

const STATUS = ['Pendente','Aguardando prestador','Encaminhado','Resolvido'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const digits = s => String(s || '').replace(/\D/g, '');
const alnum = s => String(s || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
const opts = (list, sel) => list.map(v => `<option${v === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
const fmtHora = d => new Date(d).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
const fmtData = d => new Date(d).toLocaleDateString('pt-BR');
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; };
function dayLabel(d){
  const k = dayKey(d), today = dayKey(Date.now()), y = dayKey(Date.now() - 864e5);
  if (k === today) return 'Hoje';
  if (k === y) return 'Ontem';
  return new Date(d).toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'});
}
function toast(msg, kind=''){

/* ===================== Banco local (IndexedDB) ===================== */
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('central-chamados', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('calls', {keyPath:'id'});
        d.createObjectStore('audio', {keyPath:'id'});
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  put(store, v){ return this.tx(store, 'readwrite', s => s.put(v)); },
  get(store, id){ return this.tx(store, 'readonly', s => s.get(id)); },
  all(store){ return this.tx(store, 'readonly', s => s.getAll()); },
  del(store, id){ return this.tx(store, 'readwrite', s => s.delete(id)); },
};

function buildReport(c){
  const L = [];
  L.push('RELATÓRIO DE ATENDIMENTO');
  L.push(`Registro: ${c.registro}${c.protocolo ? ' | Protocolo: ' + c.protocolo : ''}`);
  L.push(`Data: ${fmtData(c.inicio)} | ${fmtHora(c.inicio)} – ${fmtHora(c.fim)} (duração ${fmtDur(c.duracao)})`);
  L.push(`Atendimento: ${c.categoria} – ${c.tipo} | Prioridade: ${c.prioridade}`);
  const cli = [c.cliente && 'Cliente: ' + c.cliente, c.telefone && 'Tel: ' + c.telefone, c.identificador && 'Placa/Apólice: ' + c.identificador].filter(Boolean);
  if (cli.length) L.push(cli.join(' | '));
  if (c.local) L.push('Local: ' + c.local);
  L.push('', 'RESUMO', (c.notas || '').trim() || '(sem observações)');
  const items = checklistFor(c.categoria, c.tipo);
  if (items.length){
    L.push('', 'CHECKLIST');
    items.forEach(i => L.push(`${c.checklist && c.checklist[i] ? '[x]' : '[ ]'} ${i}`));
  }
  if (c.marcadores && c.marcadores.length){
    L.push('', 'LINHA DO TEMPO');
    c.marcadores.forEach(m => L.push(`[${fmtDur(m.t)}] ${m.label}`));
  }
  L.push('', `STATUS: ${c.status}`);
  if (c.atendente) L.push(`Atendente: ${c.atendente}`);
  return L.join('\n');
}

function bindForm(root, c = {}, selfId = null){
  const f = n => root.querySelector(`[name="${n}"]`);

    root.querySelectorAll('[data-item]').forEach(el => checks[el.dataset.item] = el.checked);

  };
  f('categoria').addEventListener('change', () => { f('tipo').innerHTML = opts(CATEGORIAS[f('categoria').value]); renderChecks(); });
  f('tipo').addEventListener('change', renderChecks);

  // Histórico: mostra atendimentos anteriores do mesmo telefone ou placa/apólice
  const hist = root.querySelector('[data-history]');
  const runHist = () => {

      (tel.length >= 8 && digits(x.telefone).slice(-8) === tel.slice(-8)) ||

    )).sort((a, b) => b.inicio.localeCompare(a.inicio));
    hist.hidden = !hits.length;

  };
  ['telefone', 'identificador'].forEach(n => f(n).addEventListener('input', runHist));
  renderChecks(); runHist();
}

/* ===================== Lista ===================== */
function filtered(){
  const q = norm($('#q').value).trim();
  const per = $('#fPeriodo').value, cat = $('#fCat').value, st = $('#fStatus').value;
  const now = Date.now(), tk = dayKey(now);
  return calls.filter(c => {
    if (per === 'hoje' && dayKey(c.inicio) !== tk) return false;
    if (per !== 'hoje' && per !== 'todos' && now - new Date(c.inicio) > per * 864e5) return false;
    if (cat && c.categoria !== cat) return false;
    if (st === 'aberto' ? !ABERTOS.includes(c.status) : (st && c.status !== st)) return false;
    if (q){
      const hay = norm([c.registro, c.protocolo, c.cliente, c.telefone, c.identificador, c.tipo, c.categoria, c.local, c.notas, c.status,
        ...(c.marcadores || []).map(m => m.label)].join(' '));
      // números digitados com ou sem pontuação (telefone, protocolo) também casam
      const hayDigits = digits(hay);
      if (!q.split(/\s+/).every(w => hay.includes(w) || (/^[\d().\-]+$/.test(w) && digits(w).length >= 3 && hayDigits.includes(digits(w))))) return false;
    }
    return true;
  }).sort((a, b) => b.inicio.localeCompare(a.inicio));
}

    </button>`;
  }
  $('#list').innerHTML = html;
}

/* ===================== Chamada ao vivo ===================== */
function elapsed(){
  if (!live) return 0;
  const now = live.pauseStart ?? Date.now();
  return (now - live.startTs - live.pausedMs) / 1000;
}
async function startCall(){
  if (live){ setView('live'); return; }
  if (player) player.audio.pause();
  if (!window.MediaRecorder || !navigator.mediaDevices){ toast('Este navegador não suporta gravação. Use Chrome ou Edge.', 'warn'); }
  const L = { startTs: 0, pausedMs: 0, pauseStart: null, marks: [], chunks: [], streams: [], rec: null, ctx: null, analyser: null, pendingT: null, srcLabel: '' };
  let mic = null, disp = null;
  if (navigator.mediaDevices){
    try {
      mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
      L.streams.push(mic);
    } catch (e) { toast('Microfone não autorizado — o chamado será registrado sem gravação.', 'warn'); }
    if (settings.audioMode === 'mix'){
      try {
        disp = await navigator.mediaDevices.getDisplayMedia({video: true, audio: true});
        L.streams.push(disp);
        if (!disp.getAudioTracks().length) toast('O áudio do computador não foi compartilhado — gravando só o microfone.', 'warn');
      } catch (e) { toast('Compartilhamento cancelado — gravando só o microfone.', 'warn'); }
    }
  }
  const sources = [mic, disp].filter(s => s && s.getAudioTracks().length);
  if (sources.length && window.MediaRecorder){
    try {
      const ctx = new AudioContext();
      const dest = ctx.createMediaStreamDestination();
      dest.channelCount = 1;
      const an = ctx.createAnalyser(); an.fftSize = 512;
      sources.forEach(s => { const src = ctx.createMediaStreamSource(new MediaStream(s.getAudioTracks())); src.connect(dest); src.connect(an); });
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported(m)) || '';
      const rec = new MediaRecorder(dest.stream, mime ? {mimeType: mime, audioBitsPerSecond: 32000} : undefined);
      rec.ondataavailable = e => { if (e.data && e.data.size) L.chunks.push(e.data); };
      rec.start(1000);
      Object.assign(L, {ctx, rec, analyser: an, mime: rec.mimeType || mime || 'audio/webm'});
      L.srcLabel = sources.length === 2 ? 'Gravando microfone + áudio do computador' : (sources[0] === disp ? 'Gravando áudio do computador' : 'Gravando microfone');
      if (disp) disp.getTracks().forEach(t => t.addEventListener('ended', () => { if (live === L) toast('Compartilhamento de áudio do computador encerrado.', 'warn'); }));
    } catch (e) {
      console.error(e);
      toast('Não foi possível iniciar a gravação — registrando sem áudio.', 'warn');
      L.srcLabel = 'Sem gravação de áudio';
    }
  } else {
    L.srcLabel = 'Sem gravação de áudio';
  }
  L.startTs = Date.now();
  live = L;
  renderLive();
  setView('live');
  renderStartBtn();
  live.timer = setInterval(tickLive, 250);
  meterLoop();
  setTimeout(() => { const el = $('#livePanel [name="protocolo"]'); el && el.focus(); }, 50);
}

function addMark(label, t){
  if (!live) return;
  t = t ?? live.pendingT ?? elapsed();
  live.pendingT = null;
  live.marks.push({t: Math.round(t), label: (label || '').trim() || 'Marcador'});
  live.marks.sort((a, b) => a.t - b.t);
  $('#markInput').value = '';
  renderLiveMarks();
}
function renderLiveMarks(){
  const ul = $('#liveMarks');
  ul.innerHTML = live.marks.length
    ? live.marks.map((m, i) => `<li><span class="t">${fmtDur(m.t)}</span><span class="l">${esc(m.label)}</span><button class="x" data-rm="${i}" title="Remover">✕</button></li>`).join('')
    : '<li class="marks-empty">Nenhum marcador ainda.</li>';
  ul.onclick = e => { const b = e.target.closest('[data-rm]'); if (b){ live.marks.splice(+b.dataset.rm, 1); renderLiveMarks(); } };
}
function tickLive(){
  if (!live) return;
  const t = fmtDur(elapsed());
  const el = $('#liveTimer'); if (el) el.textContent = t;
  $('#liveBanner').innerHTML = `<span class="rec-dot"></span> Chamada em andamento <span class="live-timer">${t}</span><span style="flex:1"></span><span class="small">Voltar para a chamada →</span>`;
}
function meterLoop(){
  if (!live) return;
  const bar = $('#meterBar');
  if (live.analyser && bar){
    const buf = new Uint8Array(live.analyser.fftSize);
    live.analyser.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf){ const x = (v - 128) / 128; sum += x * x; }
    const rms = Math.sqrt(sum / buf.length);
    bar.style.width = live.pauseStart ? '0%' : Math.min(100, rms * 400) + '%';
  }
  live.raf = requestAnimationFrame(meterLoop);
}
function togglePause(){
  if (!live || !live.rec) return;
  if (live.pauseStart){
    live.pausedMs += Date.now() - live.pauseStart; live.pauseStart = null;
    if (live.rec.state === 'paused') live.rec.resume();
  } else {
    live.pauseStart = Date.now();
    if (live.rec.state === 'recording') live.rec.pause();
  }
  const paused = !!live.pauseStart;
  $('#liveHead').classList.toggle('paused', paused);
  $('#liveState').textContent = paused ? 'Gravação pausada' : 'Chamada em andamento';
  $('#btnPause').innerHTML = paused ? `${ICON.play(14)} Retomar` : `${ICON.pause(14)} Pausar`;
}
function stopLive(){
  clearInterval(live.timer); cancelAnimationFrame(live.raf);
  live.streams.forEach(s => s.getTracks().forEach(t => t.stop()));
  if (live.ctx) live.ctx.close().catch(() => {});
}
function makeRegistro(ts){
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  const prefix = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
  const max = calls.filter(c => c.registro && c.registro.startsWith(prefix))
    .reduce((m, c) => Math.max(m, parseInt(c.registro.split('-')[1], 10) || 0), 0);
  return `${prefix}-${String(max + 1).padStart(3, '0')}`;
}
async function finishCall(){
  if (!live || live.finishing) return;
  live.finishing = true;
  const form = readForm($('#liveForm'));
  if (live.pauseStart) togglePause();
  const dur = elapsed();
  const fim = new Date();
  let blob = null;
  if (live.rec && live.rec.state !== 'inactive'){
    await new Promise(r => { live.rec.onstop = r; live.rec.stop(); });
    blob = new Blob(live.chunks, {type: live.mime});
  }
  stopLive();
  const id = 'C' + live.startTs;
  const call = {
    id, registro: makeRegistro(live.startTs),
    inicio: new Date(live.startTs).toISOString(), fim: fim.toISOString(), duracao: Math.round(dur),
    ...form, marcadores: live.marks, atendente: settings.atendente, hasAudio: !!(blob && blob.size),
  };
  try {
    if (call.hasAudio) await DB.put('audio', {id, blob, mime: blob.type});
    await DB.put('calls', call);
  } catch (e) {
    console.error(e);
    toast('Erro ao salvar o chamado: ' + (e && e.message || e), 'warn');
    live.finishing = false;
    return;
  }
  live = null;
  calls.push(call);
  renderAll();
  openCall(id);
  toast('Chamado registrado ✓');
}
function discardCall(){
  if (!live) return;
  if (!confirm('Descartar esta chamada? A gravação e os dados preenchidos serão perdidos.')) return;
  if (live.rec && live.rec.state !== 'inactive') live.rec.stop();
  stopLive();
  live = null;
  renderStartBtn();
  $('#livePanel').innerHTML = '';
  if (selectedId) openCall(selectedId); else renderEmpty();
}

/* ===================== Player ===================== */
function destroyPlayer(){
  if (!player) return;
  player.audio.pause();
  cancelAnimationFrame(player.raf);
  URL.revokeObjectURL(player.url);
  player = null;
}
async function setupPlayer(c){
  const rec = await DB.get('audio', c.id);
  if (selectedId !== c.id) return;
  if (!rec){ $('#waveMsg').textContent = 'Gravação não encontrada.'; return; }
  const url = URL.createObjectURL(rec.blob);
  const audio = new Audio();
  audio.preload = 'auto';
  const p = player = {audio, url, dur: c.duracao || 0, peaks: null, call: c, raf: 0};
  // Gravações webm do navegador vêm sem duração: força o cálculo para permitir avançar/voltar
  audio.addEventListener('loadedmetadata', () => {
    if (!isFinite(audio.duration)){
      const fix = () => { audio.removeEventListener('timeupdate', fix); if (isFinite(audio.duration)) p.dur = audio.duration; audio.currentTime = 0; updateTime(); };
      audio.addEventListener('timeupdate', fix);
      audio.currentTime = 1e7;
    } else { p.dur = audio.duration; updateTime(); }
  });
  audio.addEventListener('play', () => { $('#pPlay') && ($('#pPlay').innerHTML = ICON.pause(20)); loop(); });
  audio.addEventListener('pause', () => { $('#pPlay') && ($('#pPlay').innerHTML = ICON.play(20)); cancelAnimationFrame(p.raf); updateTime(); });
  audio.addEventListener('ended', () => { audio.pause(); });
  audio.addEventListener('seeked', updateTime);
  audio.src = url;
  const loop = () => { if (player !== p) return; updateTime(); p.raf = requestAnimationFrame(loop); };

  $('#pPlay').onclick = togglePlay;
  $('#pBack').onclick = () => skip(-10);
  $('#pFwd').onclick = () => skip(10);
  $('#pRate').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    audio.playbackRate = +b.dataset.r;
    $('#pRate').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  };
  const wrap = $('#waveWrap');
  const tAt = e => { const r = wrap.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * p.dur; };
  wrap.onclick = e => seek(tAt(e));
  wrap.onmousemove = e => { const h = $('#waveHover'); h.style.display = 'block'; h.style.left = (e.clientX - wrap.getBoundingClientRect().left) + 'px'; h.textContent = fmtDur(tAt(e)); };
  wrap.onmouseleave = () => { $('#waveHover').style.display = 'none'; };

  // Forma de onda
  try {
    const buf = await rec.blob.arrayBuffer();
    const ab = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(buf);
    if (player !== p) return;
    const data = ab.getChannelData(0), N = 1500, step = Math.max(1, Math.floor(data.length / N));
    const peaks = new Float32Array(N);
    for (let i = 0; i < N; i++){
      let m = 0; const s = i * step, e = Math.min(data.length, s + step);
      for (let j = s; j < e; j += 4){ const v = Math.abs(data[j]); if (v > m) m = v; }
      peaks[i] = m;
    }
    const max = peaks.reduce((a, b) => Math.max(a, b), 0) || 1;
    p.peaks = peaks.map(v => v / max);
    if (!isFinite(audio.duration)) p.dur = ab.duration;
    $('#waveMsg').textContent = '';
  } catch (e) {
    if (player === p) $('#waveMsg').textContent = '';
  }
  updateTime();
}
function updateTime(){
  if (!player) return;
  const cur = $('#pCur'), dur = $('#pDur');
  if (cur) cur.textContent = fmtDur(player.audio.currentTime);
  if (dur && player.dur) dur.textContent = fmtDur(player.dur);
  drawWave();
}
function drawWave(){
  const p = player, cv = $('#wave');
  if (!p || !cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const cBase = cs.getPropertyValue('--wave').trim(), cPlay = cs.getPropertyValue('--wave-played').trim(), cMark = cs.getPropertyValue('--mark').trim();
  const top = 12, mid = top + (h - top) / 2, amp = (h - top) / 2 - 4;
  const bw = 2, gap = 1, n = Math.floor(w / (bw + gap));
  const prog = p.dur ? p.audio.currentTime / p.dur : 0;
  for (let i = 0; i < n; i++){
    const v = p.peaks ? p.peaks[Math.floor(i / n * p.peaks.length)] : 0.08;
    const bh = Math.max(2, v * amp * 2);
    ctx.fillStyle = i / n <= prog ? cPlay : cBase;
    ctx.fillRect(i * (bw + gap), mid - bh / 2, bw, bh);
  }
  ctx.fillStyle = cMark; ctx.strokeStyle = cMark; ctx.lineWidth = 1;
  for (const m of (p.call.marcadores || [])){
    if (!p.dur) break;
    const x = Math.round(m.t / p.dur * w) + 0.5;
    ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, h); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(x - 5, 2); ctx.lineTo(x + 5, 2); ctx.lineTo(x, 10); ctx.closePath(); ctx.fill();
  }
  const px = Math.round(prog * w) + 0.5;
  ctx.strokeStyle = cPlay; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, top - 2); ctx.lineTo(px, h); ctx.stroke();
}
function togglePlay(){ if (!player) return; player.audio.paused ? player.audio.play() : player.audio.pause(); }
function seek(t){ if (!player) return; player.audio.currentTime = Math.max(0, Math.min(player.dur || 0, t)); updateTime(); }
function skip(d){ if (player) seek(player.audio.currentTime + d); }

/* ===================== CRM de reuniões (backend + extensão CallTrack Copilot) ===================== */
const OUTCOMES = [
  {key:'open', label:'Em aberto', color:'var(--info)'},
  {key:'won',  label:'Fechado (won)', color:'var(--ok)'},
  {key:'lost', label:'Perdido (lost)', color:'var(--danger)'},
];
const STAGES = [['S','Situation'], ['P','Pain'], ['I','Impact'], ['CE','Critical Event'], ['D','Decision']];
const STAGE_STATUS = {none:['Não abordada','neutral'], partial:['Parcial','warn'], complete:['Completa','ok']};
const CALL_STATUS = {live:['Ao vivo','danger'], processing:['Processando','info'], failed:['Análise falhou','danger']};
const EVENT_LABEL = {stage_change:'Etapa', suggestion:'Sugestão', objection:'Objeção', case_request:'Pediu case', overpromise:'Overpromise'};
const PRIORITY = {high:['Alta','danger'], medium:['Média','warn'], low:['Baixa','neutral']};

const crm = {base:'', token:'', calls:[], loaded:false, loading:false, timer:null};

function crmDefaultBase(){ return /^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:8787'; }
function crmLoadCreds(){
  try {
    crm.base = localStorage.getItem('ct-crm-base') || crmDefaultBase();
    crm.token = localStorage.getItem('ct-crm-token') || localStorage.getItem('spiced_token') || '';
  } catch (e) { crm.base = crmDefaultBase(); }
  // A extensão abre o CRM com #token=… (o fragmento não vai ao servidor nem fica no log).
  const m = location.hash.match(/(?:^#|&)token=([^&]+)/);
  if (m){
    crm.token = decodeURIComponent(m[1]);
    if (/^https?:$/.test(location.protocol)) crm.base = location.origin;
    crmSaveCreds();
    settings.mode = 'crm';
    history.replaceState(null, '', location.pathname + location.search);
  }
}
function crmSaveCreds(){
  try { localStorage.setItem('ct-crm-base', crm.base); localStorage.setItem('ct-crm-token', crm.token); localStorage.removeItem('spiced_token'); } catch (e) {}
}

async function crmApi(path, opts = {}){
  const headers = {Authorization: `Bearer ${crm.token}`};
  if (opts.body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(crm.base.replace(/\/+$/, '') + path, {...opts, headers}); }
  catch (e) { throw Object.assign(new Error(`Não foi possível conectar a ${crm.base}.`), {network:true}); }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401){ crmShowLogin('Token inválido ou expirado.'); throw Object.assign(new Error('Token inválido.'), {auth:true}); }
  if (!r.ok) throw new Error(data.error || `Erro ${r.status}`);
  return data;
}

function crmShowLogin(msg = ''){
  crm.loaded = false; crm.calls = [];
  const f = $('#crmLoginForm');
  f.base.value = crm.base; f.token.value = '';
  $('#crmErr').textContent = msg;
  $('#crmLogin').hidden = false; $('#crmApp').hidden = true;
  renderStats();
  if (settings.mode === 'crm') setTimeout(() => f.token.focus(), 30);
}

async function loadCrm(){
  if (!crm.token) return crmShowLogin();
  if (crm.loading) return;
  crm.loading = true;
  const token = crm.token;
  $('#crmMeta').textContent = 'Atualizando…';
  try {
    crm.calls = await crmApi('/api/crm/calls');
    crm.loaded = true;
    $('#crmLogin').hidden = true; $('#crmApp').hidden = false;
    renderCrm();
  } catch (e) {
    if (e.auth) return;
    if (!crm.loaded) crmShowLogin(e.message);
    else toast(e.message, 'warn');
  } finally {
    crm.loading = false;
    if (crm.token && crm.token !== token) loadCrm(); // token trocado durante o carregamento
  }
}

const scoreClass = v => v >= 7 ? 'ok' : v >= 5 ? 'warn' : 'danger';
const fmtScore = v => typeof v === 'number' ? v.toFixed(1).replace('.', ',') : '–';
const callDur = c => c.ended_at ? (new Date(c.ended_at) - new Date(c.started_at)) / 1000 : (c.analysis?.summary?.duration_s || 0);
const callTitle = c => c.lead_name || c.meeting_title || 'Call sem nome';
const callSub = c => [c.lead_company, c.lead_role].filter(Boolean).join(' · ') || (c.lead_name && c.meeting_title) || c.meeting_code || 'Sem empresa';

function crmFiltered(){
  const q = norm($('#crmQ').value).trim();
  const seller = $('#crmSeller').value, per = $('#crmPeriodo').value;
  const since = per === 'todos' ? 0 : Date.now() - (+per) * 864e5;
  return crm.calls.filter(c => {
    if (seller && c.seller_name !== seller) return false;
    if (new Date(c.started_at).getTime() < since) return false;
    if (q){
      const s = c.analysis?.summary || {};
      const hay = norm([c.lead_name, c.lead_company, c.lead_role, c.meeting_title, c.meeting_code, c.seller_name, c.crm_deal_id,
        ...(c.participants || []).map(p => p.name),
        s.goals, s.situation, s.financial_impact, s.decision_process, s.critical_event].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}

    <div class="item-sub">${esc(callSub(c))}</div>
    <div class="kcard-meta">
      <span>${fmtData(c.started_at)} ${fmtHora(c.started_at)}</span>
      <span>· ${esc(c.seller_name || 'Vendedor')}</span>
      ${callDur(c) ? `<span>· ${fmtDur(callDur(c))}</span>` : ''}
      ${st ? `<span class="badge ${st[1]}">${st[0]}</span>` : ''}
      ${a?.is_critical ? '<span class="badge danger">Risco</span>' : ''}
    </div>
    ${people.length ? `<div class="avs">${people.map(p => avatarHTML(p, 22)).join('')}<span class="muted small">${people.length === 1 ? esc(people[0].name) : people.length + ' participantes'}</span></div>` : ''}
    ${stagePills(a)}
  </article>`;
}

function renderCrm(){
  const sel = $('#crmSeller'), cur = sel.value;
  const sellers = [...new Set(crm.calls.map(c => c.seller_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos os vendedores</option>' + opts(sellers, cur);
  const list = crmFiltered().sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
  $('#board').innerHTML = OUTCOMES.map(o => {
    const items = list.filter(c => (c.outcome || 'open') === o.key);
    return `<div class="kcol" data-outcome="${o.key}">
      <h3><span class="dot" style="background:${o.color}"></span>${o.label}<span class="n">${items.length}</span></h3>
      <div class="kcards">${items.map(kcardHTML).join('') || '<div class="kempty">Arraste uma call para cá</div>'}</div>
    </div>`;
  }).join('');
  $('#crmMeta').textContent = `${list.length} de ${crm.calls.length} calls · atualizado ${fmtHora(Date.now())}`;
  renderStats();
}

function renderCrmStats(){
  if (!crm.loaded){ $('#stats').innerHTML = ''; return; }
  const list = crmFiltered();
  const scored = list.filter(c => typeof c.analysis?.score === 'number');
  const avg = scored.length ? scored.reduce((s, c) => s + c.analysis.score, 0) / scored.length : null;
  const won = list.filter(c => c.outcome === 'won').length;
  const risk = list.filter(c => c.analysis?.is_critical).length;
  const liveNow = crm.calls.filter(c => c.status === 'live').length;
  $('#stats').innerHTML = `
    ${liveNow ? `<div class="stat live"><b>${liveNow}</b><span>Ao vivo agora</span></div>` : ''}
    <div class="stat"><b>${list.length}</b><span>Calls no período</span></div>
    <div class="stat"><b>${avg === null ? '–' : fmtScore(avg)}</b><span>Nota média</span></div>
    <div class="stat"><b>${won}</b><span>Fechadas (won)</span></div>
    <div class="stat ${risk ? 'warn' : ''}"><b>${risk}</b><span>Em risco</span></div>`;
}

async function setOutcome(id, outcome){
  const c = crm.calls.find(x => x._id === id);
  if (!c || (c.outcome || 'open') === outcome) return;
  const prev = c.outcome;
  c.outcome = outcome; renderCrm();
  try {
    await crmApi(`/calls/${encodeURIComponent(id)}`, {method:'PATCH', body: JSON.stringify({outcome})});
    toast(`Movida para ${OUTCOMES.find(o => o.key === outcome).label}`);
  } catch (e) {
    c.outcome = prev; renderCrm();
    if (!e.auth) toast('Não foi possível mover: ' + e.message, 'warn');
  }
}

/* ---------- Detalhe da call ---------- */
// Abre com /calls/:id (análise) + /calls/:id/live (etapas ao vivo, participantes, saúde).
// Enquanto a call está ao vivo, busca só o que mudou a cada 3 s; o formulário não é redesenhado.
const HEALTH = {
  good: {label:'Fluindo', cls:'ok'},
  warn: {label:'Atenção', cls:'warn'},
  risk: {label:'Risco', cls:'danger'},
  idle: {label:'Sem captura', cls:'neutral'},
};
const ROLE_LABEL = {seller:'Vendedor', lead:'Lead', internal:'Time'};
const cd = {id:null, call:null, analysis:null, live:null, turns:[], turnsById:new Map(), events:[], poll:null, clock:null, lastSeq:-1, busy:false};

function liveBadge(health, extra = ''){
  const h = HEALTH[health?.level] || HEALTH.idle;
  return `<span class="live-badge ${h.cls}${extra}" title="${esc(health?.reason || '')}"><i></i>Ao vivo · ${h.label}</span>`;
}
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function avatarHTML(p, size = 28){
  const img = p.avatar_url && /^https:\/\//.test(p.avatar_url)
    ? `<img src="${esc(p.avatar_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="av ${esc(p.role || '')}" style="--av:${size}px" title="${esc(p.name)}">${esc(initials(p.name))}${img}</span>`;
}

function closeCrmCall(){
  clearInterval(cd.poll); clearInterval(cd.clock);
  cd.poll = cd.clock = null; cd.id = null;
}

async function openCrmCall(id){
  const base = crm.calls.find(x => x._id === id);
  if (!base) return;
  closeCrmCall();
  Object.assign(cd, {id, call:{...base}, analysis:base.analysis, live:null, turns:[], turnsById:new Map(), events:[], lastSeq:-1});
  $('#crmCallBody').innerHTML = `<div class="muted">Carregando call…</div>`;
  if (!$('#dlgCrmCall').open) $('#dlgCrmCall').showModal();
  try {
    const [full, live] = await Promise.all([
      crmApi(`/calls/${encodeURIComponent(id)}`),
      crmApi(`/calls/${encodeURIComponent(id)}/live`),
    ]);
    if (cd.id !== id) return;
    cd.analysis = full.analysis;
    applyLive(live, true);
    renderCrmCallShell();
    renderCrmCallParts();
    scheduleCrmPoll();
  } catch (e) {
    if (e.auth) return $('#dlgCrmCall').close();
    $('#crmCallBody').innerHTML = `<div class="crm-err">${esc(e.message)}</div><div class="dlg-actions"><button class="btn" id="cdClose">Fechar</button></div>`;
    $('#cdClose').onclick = () => $('#dlgCrmCall').close();
  }
}

function applyLive(d, reset = false){
  const seller = cd.call?.seller_name;
  cd.call = {...cd.call, ...d.call, seller_name: seller};
  cd.live = d.live;
  if (reset){ cd.turns = []; cd.turnsById = new Map(); }
  for (const t of d.turns || []){
    if (cd.turnsById.has(t.seq)) continue;
    cd.turns.push(t); cd.turnsById.set(t.seq, t);
  }
  cd.turns.sort((a, b) => a.seq - b.seq);
  cd.lastSeq = cd.turns.length ? cd.turns.at(-1).seq : -1;
  cd.events = d.events || [];
  // reflete no quadro sem esperar o próximo refresh
  const item = crm.calls.find(x => x._id === cd.id);
  if (item){
    Object.assign(item, {status: cd.call.status, participants: cd.call.participants, lead_name: cd.call.lead_name,
      lead_company: cd.call.lead_company, lead_role: cd.call.lead_role, meeting_title: cd.call.meeting_title,
      live_health: cd.call.status === 'live' ? d.live?.health : null});
  }
}

function scheduleCrmPoll(){
  clearInterval(cd.poll); clearInterval(cd.clock);
  const status = cd.call.status;
  if (status === 'live'){
    cd.clock = setInterval(() => { const el = $('#cdTimer'); if (el) el.textContent = fmtDur((Date.now() - new Date(cd.call.started_at)) / 1000); }, 1000);
    cd.poll = setInterval(pollCrmCall, 3000);
  } else if (status === 'processing' || (status === 'done' && !cd.analysis)){
    cd.poll = setInterval(pollCrmCall, 5000);
  }
}

async function pollCrmCall(){
  if (cd.busy || !cd.id || document.hidden) return;
  cd.busy = true;
  const id = cd.id, wasLive = cd.call.status === 'live';
  try {
    const d = await crmApi(`/calls/${encodeURIComponent(id)}/live?since=${cd.lastSeq}`);
    if (cd.id !== id) return;
    applyLive(d);
    if (cd.call.status !== 'live' && !cd.analysis){
      const full = await crmApi(`/calls/${encodeURIComponent(id)}`);
      if (cd.id !== id) return;
      cd.analysis = full.analysis;
    }
    if (wasLive !== (cd.call.status === 'live') || (cd.analysis && !$('#cdAnalysis')?.dataset.filled)){
      renderCrmCallShell(); // status mudou: troca o cabeçalho e as seções
      scheduleCrmPoll();
      renderCrm();
    }
    renderCrmCallParts();
  } catch (e) {
    if (e.auth) $('#dlgCrmCall').close();
  } finally {
    cd.busy = false;
  }
}

// Estrutura fixa do detalhe (inclui o formulário, que não é redesenhado durante o polling).
function renderCrmCallShell(){
  const c = cd.call, isLive = c.status === 'live';
  const manual = new Set(c.manual_fields || []);
  const field = (name, label, value) => {
    const auto = value && !manual.has(name) && ['lead_name','lead_company','lead_role','meeting_title'].includes(name);
    return `<label><span class="lbl">${label}${auto ? '<span class="auto" title="Preenchido automaticamente pela call">auto</span>' : ''}</span><input name="${name}" value="${esc(value || '')}" autocomplete="off"></label>`;
  };
  $('#crmCallBody').innerHTML = `
    <div class="cd-head">
      <div class="grow">
        <div class="cd-kicker">${isLive ? liveBadge(c.live_health || cd.live?.health, '') : ''} <span id="cdStatus"></span></div>
        <h2 id="cdTitle"></h2>
        <div class="muted small" id="cdSub"></div>
      </div>
      <div class="cd-right" id="cdRight"></div>
      <select class="status-select" id="cdOutcome" title="Resultado">${OUTCOMES.map(o => `<option value="${o.key}"${(c.outcome || 'open') === o.key ? ' selected' : ''}>${o.label}</option>`).join('')}</select>
      <button class="btn icon ghost" id="cdClose" title="Fechar">✕</button>
    </div>
    <div id="cdHealth"></div>
    <div id="cdPeople"></div>

    <div class="card">
      <div class="card-title">Dados da call <span class="spacer"></span><span class="muted small">Campos marcados com <span class="auto">auto</span> vêm da própria call; editar trava o valor.</span></div>
      <form class="cd-edit" id="cdEdit" onsubmit="return false">
        ${field('lead_name', 'Lead', c.lead_name)}
        ${field('lead_company', 'Empresa', c.lead_company)}
        ${field('lead_role', 'Cargo', c.lead_role)}
        ${field('meeting_title', 'Título da reunião', c.meeting_title)}
        ${field('crm_deal_id', 'ID do negócio', c.crm_deal_id)}
        <button class="btn primary" id="cdSave">Salvar</button>
      </form>
    </div>

    <div id="cdKpis"></div>
    <div class="card"><div class="card-title">Etapas SPICED ${isLive ? '<span class="badge info">em tempo real</span>' : ''}<span class="spacer"></span><span class="muted small" id="cdStagesMeta"></span></div><div class="spiced" id="cdStages"></div></div>
    <div id="cdAnalysis"></div>
    <div class="grid-2" style="margin-top:14px">
      <div class="card"><div class="card-title">Transcrição <span class="muted small" id="cdTurnCount"></span>${isLive ? '<span class="spacer"></span><label class="check small"><input type="checkbox" id="cdFollow" checked> Acompanhar</label>' : ''}</div><div class="turns" id="cdTurns"></div></div>
      <div class="card"><div class="card-title">${isLive ? 'Sugestões e sinais ao vivo' : 'Linha do tempo ao vivo'}</div><div id="cdEvents"></div>${isLive ? '<div class="card-title" style="margin:14px 0 8px">Resumo até agora</div><div id="cdSummary" class="muted"></div>' : ''}</div>
    </div>`;

  $('#cdClose').onclick = () => $('#dlgCrmCall').close();
  $('#cdOutcome').onchange = e => setOutcome(c._id, e.target.value);
  $('#cdEdit').addEventListener('input', e => { if (e.target.name) e.target.dataset.touched = '1'; });
  $('#cdSave').onclick = async () => {
    const patch = readForm($('#cdEdit')); delete patch.checklist;
    try {
      const upd = await crmApi(`/calls/${encodeURIComponent(c._id)}`, {method:'PATCH', body: JSON.stringify(patch)});
      cd.call = {...cd.call, ...upd, seller_name: cd.call.seller_name};
      const item = crm.calls.find(x => x._id === c._id);
      if (item) Object.assign(item, patch, {manual_fields: upd.manual_fields});
      renderCrm(); renderCrmCallShell(); renderCrmCallParts(); toast('Call atualizada');
    } catch (e) { if (!e.auth) toast('Não foi possível salvar: ' + e.message, 'warn'); }
  };
}

// Partes que mudam durante a call (redesenhadas a cada atualização).
function renderCrmCallParts(){
  const c = cd.call, a = cd.analysis, live = cd.live || {}, isLive = c.status === 'live';
  const st = CALL_STATUS[c.status];
  const health = isLive ? (live.health || c.live_health) : null;

  const badge = document.querySelector('#crmCallBody .live-badge');
  if (badge && health) badge.outerHTML = liveBadge(health);
  $('#cdStatus').innerHTML = !isLive && st ? `<span class="badge ${st[1]}">${st[0]}</span>` : '';
  $('#cdTitle').textContent = callTitle(c);
  const who = [c.lead_company, c.lead_role].filter(Boolean).join(' · ');
  $('#cdSub').innerHTML = `${esc(who || callSub(c))} · Vendedor: ${esc(c.seller_name || '–')} · ${fmtData(c.started_at)} ${fmtHora(c.started_at)}${c.meeting_code ? ' · ' + esc(c.meeting_code) : ''}`;
  $('#cdRight').innerHTML = isLive
    ? `<div class="score" id="cdTimer">${fmtDur((Date.now() - new Date(c.started_at)) / 1000)}</div><div class="muted small">Duração</div>`
    : a ? `<div class="score ${scoreClass(a.score)}">${fmtScore(a.score)}</div><div class="muted small">Nota SPICED</div>`
    : callDur(c) ? `<div class="score">${fmtDur(callDur(c))}</div><div class="muted small">Duração</div>` : '';

  // Campos automáticos: atualiza o formulário se o usuário não estiver mexendo nele
  const form = $('#cdEdit');
  if (form && !form.contains(document.activeElement)){
    const manual = new Set(c.manual_fields || []);
    for (const k of ['lead_name', 'lead_company', 'lead_role', 'meeting_title']){
      const input = form.elements[k];
      if (!input || input.dataset.touched || manual.has(k) || input.value === (c[k] || '')) continue;
      input.value = c[k] || '';
      const lbl = input.previousElementSibling;
      if (lbl && c[k] && !lbl.querySelector('.auto')) lbl.insertAdjacentHTML('beforeend', '<span class="auto" title="Preenchido automaticamente pela call">auto</span>');
    }
  }

  // Saúde
  $('#cdHealth').innerHTML = health ? `<div class="health ${HEALTH[health.level]?.cls || 'neutral'}"><i></i><b>${HEALTH[health.level]?.label || ''}</b><span>${esc(health.reason || '')}</span></div>` : '';

  // Participantes
  const people = (c.participants || []).slice().sort((x, y) => (y.talk_ms || 0) - (x.talk_ms || 0));
  $('#cdPeople').innerHTML = people.length ? `<div class="people">${people.map(p => `
    <div class="person${p.left_at ? ' left' : ''}">
      ${avatarHTML(p, 36)}
      <div><b>${esc(p.name)}</b><div class="muted small">${ROLE_LABEL[p.role] || 'Participante'}${p.is_self ? ' (você)' : ''} · ${fmtDur((p.talk_ms || 0) / 1000)} de fala · ${p.turn_count || 0} falas</div>
      <div class="muted small">${p.first_seen_at ? 'Entrou ' + fmtHora(p.first_seen_at) : ''}${p.left_at ? ' · saiu ' + fmtHora(p.left_at) : ''}</div></div>
    </div>`).join('')}</div>` : (isLive ? '<div class="muted small" style="margin:0 0 14px">Aguardando a lista de participantes da extensão…</div>' : '');

  // KPIs
  const talkTotal = people.reduce((s, p) => s + (p.talk_ms || 0), 0);
  const sellerTalk = people.filter(p => p.role !== 'lead').reduce((s, p) => s + (p.talk_ms || 0), 0);
  $('#cdKpis').innerHTML = a ? `<div class="kpis">
      <div class="stat"><b>${Math.round(a.seller_talk_pct || 0)}%</b><span>Vendedor falou</span></div>
      <div class="stat"><b>${a.question_count ?? 0}</b><span>Perguntas</span></div>
      <div class="stat"><b>${a.turn_count ?? 0}</b><span>Trocas de turno</span></div>
      <div class="stat"><b>${fmtDur(a.longest_monologue_s)}</b><span>Maior monólogo</span></div>
      ${typeof a.cost_usd === 'number' ? `<div class="stat"><b>US$ ${a.cost_usd.toFixed(3)}</b><span>Custo da análise</span></div>` : ''}
    </div>` : isLive ? `<div class="kpis">
      <div class="stat"><b>${cd.turns.length}</b><span>Falas capturadas</span></div>
      <div class="stat"><b>${talkTotal ? Math.round(sellerTalk / talkTotal * 100) + '%' : '–'}</b><span>Vendedor falou</span></div>
      <div class="stat"><b>${cd.turns.filter(t => t.role === 'seller' && t.text.includes('?')).length}</b><span>Perguntas</span></div>
      <div class="stat"><b>${people.length}</b><span>Participantes</span></div>
    </div>` : '';

  // Etapas SPICED: status (análise final ou ao vivo) + contexto, perguntas e citações ao vivo
  const stages = a?.stages || live.stages || {};
  const know = live.knowledge || {};
  const quote = id => cd.turnsById.get(id);
  const done = STAGES.filter(([k]) => stages[k]?.status === 'complete').length;
  $('#cdStagesMeta').textContent = `${done} de ${STAGES.length} completas`;
  $('#cdStages').innerHTML = STAGES.map(([k, l]) => {
    const x = stages[k] || {status:'none'}; const [lbl, cls] = STAGE_STATUS[x.status] || [x.status, 'neutral'];
    const kn = know[k] || {};
    const qs = (kn.question_turn_ids || []).map(quote).filter(Boolean);
    const ls = (kn.quote_turn_ids || []).map(quote).filter(Boolean);
    return `<section class="stage ${esc(x.status)}">
      <header><span class="stg ${esc(x.status)}">${k}</span><b>${l}</b><span class="badge ${cls}">${lbl}</span></header>
      ${x.reason ? `<p class="why">${esc(x.reason)}</p>` : ''}
      ${kn.context ? `<div class="ctx"><span>Contexto</span>${esc(kn.context)}</div>` : ''}
      ${qs.length ? `<div class="qlist"><span>Perguntas feitas</span>${qs.map(t => `<q><em>${msClock(t.started_ms)}</em>${esc(t.text)}</q>`).join('')}</div>` : ''}
      ${ls.length ? `<div class="qlist lead"><span>O que o lead disse</span>${ls.map(t => `<q><em>${msClock(t.started_ms)}</em>${esc(t.text)}</q>`).join('')}</div>` : ''}
      ${!x.reason && !kn.context && !qs.length && !ls.length ? `<p class="muted small">${isLive ? 'Ainda não abordada.' : 'Sem informações.'}</p>` : ''}
    </section>`;
  }).join('');

  // Análise pós-call
  const an = $('#cdAnalysis');
  if (a){
    const s = a.summary || {};
    const sumRows = [['Objetivos', s.goals], ['Situação', s.situation], ['Impacto financeiro', s.financial_impact],
      ['Processo de decisão', s.decision_process], ['Evento crítico', s.critical_event]].filter(r => r[1]);
    const risks = [
      ...(a.objections || []).map(o => `<li><div class="grow">${esc(o.text || o.objection || '')}</div><span class="badge ${o.handled ? 'ok' : 'warn'}">${o.handled ? 'Tratada' : 'Não tratada'}</span></li>`),
      ...(a.risk_signals || []).map(r => `<li><div class="grow">${esc(r.note || '')}</div><span class="badge danger">${r.type === 'overpromise' ? 'Overpromise' : 'Risco'}</span></li>`),
    ];
    an.dataset.filled = '1';
    an.innerHTML = `
      <div class="card"><div class="card-title">Resumo da call</div>
        ${sumRows.length ? `<dl class="sum">${sumRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '<div class="muted">Resumo não disponível.</div>'}</div>
      <div class="grid-2">
        <div class="card"><div class="card-title">Próximos passos</div>
          ${(a.next_steps || []).length ? `<ul class="rows">${a.next_steps.map(n => { const p = PRIORITY[n.priority] || [n.priority || '', 'neutral'];
            return `<li><div class="grow">${esc(n.text || n.task || '')}<div class="muted small">${n.owner === 'manager' ? 'Gestor' : 'Vendedor'}</div></div>${p[0] ? `<span class="badge ${p[1]}">${esc(p[0])}</span>` : ''}</li>`; }).join('')}</ul>` : '<div class="muted">Nenhum passo definido.</div>'}</div>
        <div class="card"><div class="card-title">Objeções e riscos</div>
          ${risks.length ? `<ul class="rows">${risks.join('')}</ul>` : '<div class="muted">Nenhuma objeção ou risco.</div>'}</div>
      </div>`;
  } else {
    delete an.dataset.filled;
    an.innerHTML = isLive ? '' : `<div class="card"><div class="card-title">Análise</div><div class="muted">${
      c.status === 'failed' ? (cd.turns.length ? 'A análise pós-call falhou. Verifique os logs do backend.' : 'Nenhuma fala foi capturada nesta call, então não há o que analisar. Confira se as legendas do Meet estavam ativas.')
      : 'A análise desta call está sendo processada. Esta tela atualiza sozinha.'}</div></div>`;
  }

  // Transcrição
  const box = $('#cdTurns');
  $('#cdTurnCount').textContent = `(${cd.turns.length} falas)`;
  box.innerHTML = cd.turns.map(t => `<div class="turn ${esc(t.role)}"><span class="t">${msClock(t.started_ms)}</span><div><b>${esc(t.speaker_name || ROLE_LABEL[t.role] || '')}</b>${esc(t.text)}</div></div>`).join('')
    || `<div class="muted">${isLive ? 'Aguardando as primeiras falas… (as legendas do Meet precisam estar ativas)' : 'Nenhuma fala registrada.'}</div>`;
  if (isLive && ($('#cdFollow')?.checked ?? true)) box.scrollTop = box.scrollHeight;

  // Eventos
  const evs = isLive ? cd.events.slice().reverse() : cd.events;
  $('#cdEvents').innerHTML = evs.length
    ? `<ul class="rows">${evs.map(ev => `<li><span class="t">${msClock(ev.at_ms)}</span><span class="badge ${ev.type === 'stage_change' ? 'ok' : ev.type === 'suggestion' ? 'info' : 'warn'}">${EVENT_LABEL[ev.type] || esc(ev.type)}</span><div class="grow">${esc(eventText(ev))}</div></li>`).join('')}</ul>`
    : `<div class="muted">${isLive ? 'As sugestões e sinais aparecem aqui assim que a IA avaliar as primeiras falas.' : 'Nenhum evento ao vivo.'}</div>`;
  const sm = $('#cdSummary');
  if (sm) sm.textContent = live.summary || 'O resumo aparece depois de alguns minutos de conversa.';
}

const msClock = ms => fmtDur((ms || 0) / 1000);

function eventText(ev){
  const p = ev.payload || {};
  if (ev.type === 'stage_change'){
    const l = (STAGES.find(s => s[0] === p.stage) || [p.stage, p.stage])[1];
    return `${l}: ${STAGE_STATUS[p.from]?.[0] || p.from} → ${STAGE_STATUS[p.to]?.[0] || p.to}`;
  }
  if (ev.type === 'suggestion') return `[${p.stage || '–'}] ${p.text || ''}`;
  return p.note || p.text || '';
}

/* ---------- Troca de módulo ---------- */
function setMode(mode){
  settings.mode = mode; saveSettings();
  document.querySelectorAll('#modes [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('main').hidden = mode === 'crm';
  $('#crm').hidden = mode !== 'crm';
  clearInterval(crm.timer); crm.timer = null;
  if (mode === 'crm'){
    loadCrm();
    let tick = 0;
    crm.timer = setInterval(() => {
      tick += 1;
      const hasLive = crm.calls.some(c => c.status === 'live');
      if (!document.hidden && crm.loaded && !$('#dlgCrmCall').open && (hasLive || tick % 6 === 0)) loadCrm();
    }, 5000);
  }
  renderStats();
}

function bindCrm(){
  $('#icoSearchCrm').innerHTML = ICON.search(16);
  $('#modes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); };
  $('#crmLoginBtn').onclick = () => {
    const f = $('#crmLoginForm');
    const token = f.token.value.trim();
    if (!token){ $('#crmErr').textContent = 'Informe o token.'; return; }
    crm.base = f.base.value.trim() || crmDefaultBase();
    crm.token = token; crmSaveCreds();
    $('#crmErr').textContent = 'Conectando…';
    loadCrm();
  };
  $('#crmLogout').onclick = () => { crm.token = ''; crmSaveCreds(); crmShowLogin(); };
  $('#crmRefresh').onclick = loadCrm;
  $('#dlgCrmCall').addEventListener('close', () => { closeCrmCall(); renderCrm(); });
  window.addEventListener('hashchange', () => { if (/token=/.test(location.hash)){ crmLoadCreds(); setMode('crm'); } });
  $('#crmQ').addEventListener('input', renderCrm);
  ['crmSeller', 'crmPeriodo'].forEach(id => $('#' + id).addEventListener('change', renderCrm));
  const board = $('#board');
  board.addEventListener('click', e => { const k = e.target.closest('[data-cid]'); if (k) openCrmCall(k.dataset.cid); });
  board.addEventListener('keydown', e => { const k = e.target.closest('[data-cid]'); if (k && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openCrmCall(k.dataset.cid); } });
  board.addEventListener('dragstart', e => { const k = e.target.closest('[data-cid]'); if (!k) return; e.dataTransfer.setData('text/plain', k.dataset.cid); e.dataTransfer.effectAllowed = 'move'; k.classList.add('dragging'); });
  board.addEventListener('dragend', e => { e.target.closest?.('[data-cid]')?.classList.remove('dragging'); board.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
  board.addEventListener('dragover', e => { const col = e.target.closest('.kcol'); if (!col) return; e.preventDefault(); board.querySelectorAll('.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
  board.addEventListener('dragleave', e => { const col = e.target.closest('.kcol'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
  board.addEventListener('drop', e => { const col = e.target.closest('.kcol'); if (!col) return; e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setOutcome(id, col.dataset.outcome); });
}

/* ===================== Eventos globais ===================== */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'F2'){ e.preventDefault(); setMode('atend'); startCall(); return; }
  if (e.key === 'F4' && live){ e.preventDefault(); setMode('atend'); setView('live'); live.pendingT = elapsed(); $('#markInput').focus(); return; }
  if (e.key === 'F9' && live){ e.preventDefault(); setMode('atend'); setView('live'); finishCall(); return; }
  if (typing || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === '/'){ e.preventDefault(); $(settings.mode === 'crm' ? '#crmQ' : '#q').focus(); return; }
  if (settings.mode === 'atend' && view === 'detail' && player && !editing){
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'k'){ e.preventDefault(); togglePlay(); }
    else if (k === 'j'){ skip(-10); }
    else if (k === 'l'){ skip(10); }
    else if (k === 'arrowleft'){ e.preventDefault(); skip(-5); }
    else if (k === 'arrowright'){ e.preventDefault(); skip(5); }
  }
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-open]');
  if (a){ e.preventDefault(); openCall(a.dataset.open); }
});
window.addEventListener('beforeunload', e => { if (live){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => drawWave());

$('#list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openCall(b.dataset.id); });
['q', 'fPeriodo', 'fCat', 'fStatus'].forEach(id => $('#' + id).addEventListener(id === 'q' ? 'input' : 'change', renderList));
$('#btnStart').onclick = () => { setMode('atend'); startCall(); };
$('#liveBanner').onclick = () => setView('live');
$('#btnTheme').onclick = () => { settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme(); };
$('#btnSettings').onclick = () => {
  const f = $('#settingsForm');
  f.atendente.value = settings.atendente;
  f.querySelectorAll('[name=audioMode]').forEach(r => r.checked = r.value === settings.audioMode);
  $('#dlgSettings').showModal();
};
$('#dlgSettings').addEventListener('close', () => {
  if ($('#dlgSettings').returnValue !== 'ok') return;
  const f = $('#settingsForm');
  settings.atendente = f.atendente.value.trim();
  settings.audioMode = (f.querySelector('[name=audioMode]:checked') || {}).value || 'mic';
  saveSettings();
  toast('Configurações salvas');
});

/* ===================== Início ===================== */
(async function init(){
  $('#icoSearch').innerHTML = ICON.search(16);
  $('#btnSettings').innerHTML = ICON.gear(18);
  $('#fCat').innerHTML += opts(Object.keys(CATEGORIAS));
  $('#fStatus').innerHTML += opts(STATUS);
  applyTheme();
  crmLoadCreds();
  bindCrm();
  try {
    await DB.open();
    calls = await DB.all('calls');
  } catch (e) {
    toast('Não foi possível abrir o banco local: ' + (e && e.message || e), 'warn');
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  renderAll();
  renderEmpty();
  setMode(settings.mode === 'atend' ? 'atend' : 'crm');
  if (settings.mode === 'atend' && !settings.atendente) setTimeout(() => toast('Dica: informe seu nome em Configurações (engrenagem) para sair no relatório.'), 800);
})();
</script>
